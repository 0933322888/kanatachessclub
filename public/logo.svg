<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24" /> <!-- amber-400 -->
      <stop offset="50%" style="stop-color:#d97706" /> <!-- amber-600 -->
      <stop offset="100%" style="stop-color:#92400e" /> <!-- amber-800 -->
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle (Optional, kept transparent for logo integration, but good for bounding) -->
  <!-- <circle cx="250" cy="250" r="240" fill="#fff" opacity="0.05"/> -->

  <g transform="translate(100, 50) scale(0.8)" filter="url(#dropShadow)">
    
    <!-- The Vertical Stem of the K (and Back of Knight) -->
    <path d="M50,50 L130,50 L130,450 L50,450 Z" fill="#2d1b0e" />
    
    <!-- The Knight's Head (Top Right Arm of K) -->
    <!-- Connecting from the middle of the stem -->
    <path d="M130,250 L130,150 L160,100 L200,80 Q250,70 280,100 L320,130 Q340,150 340,180 L320,220 L270,220 L250,250 L130,250 Z" fill="url(#goldGradient)" />
    <!-- Detailed Mane for the Knight -->
    <path d="M160,100 Q180,60 150,40 M180,90 Q210,50 190,30 M210,80 Q240,40 230,20" stroke="#2d1b0e" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Eye -->
    <circle cx="280" cy="150" r="8" fill="#2d1b0e" />

    <!-- The Knight's Base/Leg (Bottom Right Arm of K) -->
    <path d="M130,250 L250,250 L320,380 L340,450 L200,450 L130,300 Z" fill="url(#goldGradient)" />
    
    <!-- Stylized connect to make it look like a K -->
    <!-- Adjusting the "Leg" to be more diagonal standard K leg but thick -->
    <path d="M130,280 L220,380 L300,450 L180,450 L130,350 Z" fill="#2d1b0e" opacity="0.3" /> <!-- Shadow helper -->
  </g>
  
  <!-- "K" text integration reinforcement (Subtle) -->
  <!-- The shape above forms a K. Vertical bar + Head pointing up-right + Leg pointing down-right -->

</svg>
